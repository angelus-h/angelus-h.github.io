# Markdown extensions (comprehensive support)
markdown_extensions:
  # Code highlighting and syntax
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.inlinehilite
  - pymdownx.snippets

  # Tabbed content
  - pymdownx.tabbed:
      alternate_style: true

  # Admonitions (note, warning, tip, danger boxes)
  - admonition
  - pymdownx.details

  # Icons and emojis
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

  # Lists and task lists
  - def_list
  - pymdownx.tasklist:
      custom_checkbox: true

  # Text formatting
  - pymdownx.mark        # ==highlight==
  - pymdownx.caret       # ^^underline^^
  - pymdownx.tilde       # ~~strikethrough~~
  - pymdownx.keys        # ++ctrl+alt+del++

  # Tables
  - tables

  # Footnotes
  - footnotes

  # Metadata
  - meta

  # Abbreviations
  - abbr
  - attr_list
  - md_in_html

  # Table of contents
  - toc:
      permalink: false
      toc_depth: 3

# Plugins
plugins:
  - search:
      lang: en
      separator: '[\s\-,:!=\[\]()"/]+|(?!\b)(?=[A-Z][a-z])|\.(?!\d)|&[lg]t;'
  - tags:
      tags_file: tags.md

# Extra configuration
extra:
